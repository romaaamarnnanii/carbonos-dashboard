      document.getElementById("prdClear").addEventListener("click",()=>{draftPRD=null;renderPRD();});
    }else{
      body.innerHTML=`<div class="prd-drop" id="prdDrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Drop a file here or click to browse</div>`;
      const drop=document.getElementById("prdDrop");
      drop.addEventListener("click",()=>document.getElementById("prdFileInput").click());
      drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag");});
      drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
      drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])readPRDFile(e.dataTransfer.files[0]);});
    }
  }else if(prdTab==="link"){
    body.innerHTML=`<input id="prdLinkInput" type="url" placeholder="https://…  (Notion, Google Doc, Figma)" value="${p.type==='link'?esc(p.url):''}">`;
    document.getElementById("prdLinkInput").addEventListener("input",e=>{const v=e.target.value.trim();draftPRD=v?{type:"link",url:v}:null;});
  }else{
    body.innerHTML=`<textarea id="prdTextInput" style="min-height:120px" placeholder="Write the PRD inline — problem, requirements, acceptance criteria…">${p.type==='text'?esc(p.text):''}</textarea>`;
    document.getElementById("prdTextInput").addEventListener("input",e=>{const v=e.target.value;draftPRD=v.trim()?{type:"text",text:v}:null;});
  }
}
function readPRDFile(file){
  const MAX=4*1024*1024;
  if(file.size>MAX){flash("File too large (max 4 MB)");return;}
  const r=new FileReader();
  r.onload=()=>{draftPRD={type:"file",name:file.name,size:fmtBytes(file.size),data:r.result};prdTab="file";renderPRD();};
  r.readAsDataURL(file);
}
function fmtBytes(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(0)+" KB";return (b/1048576).toFixed(1)+" MB";}

function openEdit(id){
  editingId=id;const it=items.find(i=>i.id===id);
  draft=it?{...it}:{type:"Feature",status:"Not Started",impact:"Medium",effort:"M",start:toISO(TODAY),end:toISO(TODAY)};
  draftOwners=parseOwners(draft.owner);draftPRD=draft.prd?{...draft.prd}:null;prdTab=draftPRD?draftPRD.type:"file";
  document.getElementById("drawerTitle").textContent=it?"Edit item":"New item";
  document.getElementById("deleteBtn").style.display=it?"block":"none";
  document.getElementById("fName").value=draft.name||"";document.getElementById("fNotes").value=draft.notes||"";
  fillSelect(document.getElementById("fTypeSel"),TYPES,draft.type);fillSelect(document.getElementById("fStatusSel"),STATUSES.map(s=>s.k),draft.status);
  document.getElementById("fStart").value=toISO(draft.start);document.getElementById("fEnd").value=toISO(draft.end);
  document.getElementById("fArchetype").value=draft.archetype||"";
  buildPick(document.getElementById("fImpactPick"),IMPACT,draft.impact,v=>draft.impact=v);buildPick(document.getElementById("fEffortPick"),EFFORT,draft.effort,v=>draft.effort=v);
  renderOwnerSelect();renderPRD();
  const au=document.getElementById("fAudit");
  if(it&&(it._createdBy||it._updatedBy)){au.style.display="";
    au.innerHTML=`<span class="al"><span class="ak">Added</span> by <b>${esc(it._createdBy||"—")}</b>${it._createdAt?" · "+esc(fmtDateTime(it._createdAt)):""}</span>`+
      `<span class="al"><span class="ak">Last updated</span> by <b>${esc(it._updatedBy||"—")}</b>${it._updatedAt?" · "+esc(relTime(it._updatedAt))+' <span class="am">('+esc(fmtDateTime(it._updatedAt))+")</span>":""}</span>`;
  }else{au.style.display="none";au.innerHTML="";}
  document.getElementById("scrim").classList.add("open");document.getElementById("drawer").classList.add("open");setTimeout(()=>document.getElementById("fName").focus(),120);
}
function closeEdit(){document.getElementById("scrim").classList.remove("open");document.getElementById("drawer").classList.remove("open");editingId=null;}
async function saveEdit(){
  const name=document.getElementById("fName").value.trim();if(!name){document.getElementById("fName").focus();flash("Name required");return;}
  if(REMOTE_ON)ensureUser();
  const isNew=!editingId;
  const rec={id:editingId||("R"+Date.now().toString(36)),name,notes:document.getElementById("fNotes").value.trim(),owner:draftOwners.join(", "),archetype:document.getElementById("fArchetype").value.trim(),prd:draftPRD,type:document.getElementById("fTypeSel").value,status:document.getElementById("fStatusSel").value,impact:draft.impact,effort:draft.effort,start:document.getElementById("fStart").value,end:document.getElementById("fEnd").value};
  if(!rec.start)rec.start=toISO(TODAY);if(!rec.end)rec.end=rec.start;
  if(pd(rec.end)<pd(rec.start))rec.end=rec.start;
  const now=new Date().toISOString();
  if(isNew){rec._createdBy=currentUser||"—";rec._createdAt=now;}
  else{const prev=items.find(x=>x.id===editingId);rec._createdBy=prev?prev._createdBy:(currentUser||"—");rec._createdAt=prev?prev._createdAt:now;}
  rec._updatedBy=currentUser||"—";rec._updatedAt=now;
  if(editingId){const i=items.findIndex(x=>x.id===editingId);items[i]=rec;}else items.push(rec);
  closeEdit();renderRoadmap();
  await persistTaskUpsert(rec,isNew);
}
function openPRD(item){
  const p=item.prd;if(!p)return;
  if(p.type==="link"){window.open(p.url,"_blank");}
  else if(p.type==="file"){const a=document.createElement("a");a.href=p.data;a.download=p.name;a.click();}
  else if(p.type==="text"){openEdit(item.id);setTimeout(()=>{prdTab="text";renderPRD();},60);}
}
async function deleteItem(){if(!editingId)return;const id=editingId;items=items.filter(i=>i.id!==id);closeEdit();renderRoadmap();await persistTaskDelete(id);}

/* call editor */
let draftCallThemes=[];
function callThemes(c){return (c&&c.themes&&c.themes.length)?c.themes.slice():((c&&c.theme)?[c.theme]:[]);}
function renderCallThemes(){
  const box=document.getElementById("cThemePick");if(!box)return;
  box.innerHTML=THEMES.map(t=>`<button type="button" data-t="${esc(t)}" class="${draftCallThemes.includes(t)?'on':''}">${esc(t)}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const t=b.getAttribute("data-t");
    if(draftCallThemes.includes(t))draftCallThemes=draftCallThemes.filter(x=>x!==t);else draftCallThemes.push(t);
    b.classList.toggle("on");}));
}
function openCall(id){
  editingCall=id;const c=calls.find(x=>x.id===id);
  const d=c?{...c}:{date:new Date().toISOString().slice(0,10),type:"Discovery",themes:[],pain:"Medium",prio:"P1",sentiment:"Neutral",industry:"",link:""};
  document.getElementById("callTitle").textContent=c?"Edit call":"Log a call";
  document.getElementById("delCallBtn").style.display=c?"block":"none";
  document.getElementById("cPaste").value="";document.getElementById("cSource").value=d.sourceUrl||"";document.getElementById("cDemo").value=d.demoUrl||"";
  document.getElementById("cIndustry").value=d.industry||"";
  document.getElementById("indList").innerHTML=INDUSTRIES.map(x=>`<option value="${esc(x)}">`).join("");
  document.getElementById("cCustomer").value=d.customer||"";document.getElementById("cDate").value=d.date||"";document.getElementById("cAttendees").value=d.attendees||"";document.getElementById("cQuote").value=d.quote||"";document.getElementById("cInsight").value=d.insight||"";
  draftCallThemes=callThemes(d);renderCallThemes();
  fillSelect(document.getElementById("cType"),CALL_TYPES,d.type);fillSelect(document.getElementById("cPain"),PAINS,d.pain);fillSelect(document.getElementById("cPrio"),PRIOS,d.prio);fillSelect(document.getElementById("cSentiment"),SENTIMENTS,d.sentiment||"Neutral");
  document.getElementById("cLink").innerHTML=`<option value="">— none —</option>`+items.map(it=>`<option value="${it.id}" ${it.id===d.link?'selected':''}>${esc(it.name)}</option>`).join("");
  document.getElementById("scrim2").classList.add("open");document.getElementById("callDrawer").classList.add("open");setTimeout(()=>document.getElementById("cCustomer").focus(),120);
}
function closeCall(){document.getElementById("scrim2").classList.remove("open");document.getElementById("callDrawer").classList.remove("open");editingCall=null;}
async function saveCall(){
  const customer=document.getElementById("cCustomer").value.trim();if(!customer){document.getElementById("cCustomer").focus();flash("Customer required");return;}
  const rec={id:editingCall||("CL"+Date.now().toString(36)),customer,date:document.getElementById("cDate").value,attendees:document.getElementById("cAttendees").value.trim(),type:document.getElementById("cType").value,themes:draftCallThemes.slice(),theme:draftCallThemes[0]||"",quote:document.getElementById("cQuote").value.trim(),insight:document.getElementById("cInsight").value.trim(),pain:document.getElementById("cPain").value,prio:document.getElementById("cPrio").value,link:document.getElementById("cLink").value,sourceUrl:document.getElementById("cSource").value.trim(),demoUrl:document.getElementById("cDemo").value.trim(),industry:document.getElementById("cIndustry").value.trim(),sentiment:document.getElementById("cSentiment").value};
  if(editingCall){const i=calls.findIndex(x=>x.id===editingCall);calls[i]=rec;}else calls.push(rec);
  await save();closeCall();renderLearnings();
}
async function deleteCall(){if(!editingCall)return;calls=calls.filter(c=>c.id!==editingCall);await save();closeCall();renderLearnings();flash("Deleted");}

/* standups */
function fmtDate(iso){const t=pd(iso);return t?t.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}):(iso||"");}
function renderStandupStrip(){
  const n=standups.length;
  const sorted=[...standups].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const last=sorted[0];
  const now=new Date(),mKey=now.toISOString().slice(0,7);
  const thisMonth=standups.filter(s=>(s.date||"").slice(0,7)===mKey).length;
  const withNotes=standups.filter(s=>s.sourceUrl).length;
  const cells=[{n:n,l:"Standups logged"},{n:thisMonth,l:"This month",accent:true},{n:last?fmtDate(last.date):"—",l:"Last standup",purple:true,small:true},{n:withNotes,l:"With a link"}];
  document.getElementById("standupStrip").innerHTML=cells.map(c=>`<div class="stat"><span class="n ${c.accent?'accent':''} ${c.purple?'purple':''} ${c.small?'small':''}">${c.small?esc(String(c.n)):c.n}</span><span class="l">${c.l}</span></div>`).join("");
}
function renderStandups(){
  renderStandupStrip();document.getElementById("standupCnt").textContent=standups.length;
  const grid=document.getElementById("standupGrid");
  if(!standups.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No standups recorded yet</h3><div>Capture the notes from your product standup.</div></div>`;return;}
  const sorted=[...standups].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  grid.innerHTML=sorted.map(s=>{
    const notes=s.sourceUrl?`<a class="chip notes" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">Link ↗</a>`:"";
    return `<div class="call-card" id="standup-${s.id}" data-standup="${s.id}"><div class="topaccent" style="background:var(--purple)"></div>
      <div class="ch"><span class="cust">${esc(fmtDate(s.date))}</span><span class="date">${s.present?esc(s.present):''}</span></div>
      ${s.notes?`<div class="su-notes">${esc(s.notes)}</div>`:'<div class="insight" style="color:var(--ink-faint)">No notes.</div>'}
      ${notes?`<div class="cf">${notes}</div>`:''}</div>`;
  }).join("");
  grid.querySelectorAll("[data-standup]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.closest("a"))return;openStandup(el.getAttribute("data-standup"));}));
}
function openStandup(id){
  editingStandup=id;const s=standups.find(x=>x.id===id);
  const d=s?{...s}:{date:new Date().toISOString().slice(0,10),present:"",notes:"",sourceUrl:""};
  document.getElementById("standupTitle").textContent=s?"Edit standup":"Add standup";
  document.getElementById("delStandupBtn").style.display=s?"block":"none";
  document.getElementById("sDate").value=d.date||"";document.getElementById("sPresent").value=d.present||"";
  document.getElementById("sNotes").value=d.notes||"";document.getElementById("sSource").value=d.sourceUrl||"";
  document.getElementById("scrim4").classList.add("open");document.getElementById("standupDrawer").classList.add("open");setTimeout(()=>document.getElementById("sNotes").focus(),120);
}
function closeStandup(){document.getElementById("scrim4").classList.remove("open");document.getElementById("standupDrawer").classList.remove("open");editingStandup=null;}
async function saveStandup(){
  const notes=document.getElementById("sNotes").value.trim(),date=document.getElementById("sDate").value;
  if(!notes&&!document.getElementById("sSource").value.trim()){document.getElementById("sNotes").focus();flash("Add some notes or a link");return;}
  const rec={id:editingStandup||("SU"+Date.now().toString(36)),date,present:document.getElementById("sPresent").value.trim(),notes,sourceUrl:document.getElementById("sSource").value.trim()};
  if(editingStandup){const i=standups.findIndex(x=>x.id===editingStandup);standups[i]=rec;}else standups.push(rec);
  await save();closeStandup();renderStandups();
}
async function deleteStandup(){if(!editingStandup)return;standups=standups.filter(s=>s.id!==editingStandup);await save();closeStandup();renderStandups();flash("Deleted");}

/* import / export */
function exportJSON(){const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),items,meth,calls,builds,standups},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`carbonos-dashboard-${new Date().toISOString().slice(0,10)}.json`;a.click();flash("Exported backup");}
function importJSON(file){const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){items=d;}else{items=d.items||items;meth=d.meth||meth;calls=d.calls||calls;builds=d.builds||builds;standups=d.standups||standups;}meth.forEach(m=>{if(m.due===undefined)m.due="";});migrateItems();cacheLocal();if(REMOTE_ON){try{await remoteReplaceAllTasks();}catch(e){}lastSig=null;}else{await save(true);}renderAll();flash("Imported");}catch(e){flash("Couldn't read that file");}};r.readAsText(file);}

function renderFilterOptions(){
  const archOpts=Array.from(new Set([...ARCHETYPES,...items.map(i=>i.archetype).filter(Boolean)]));
  document.getElementById("fStatus").innerHTML=`<option value="">All statuses</option>`+STATUSES.map(x=>`<option>${x.k}</option>`).join("");
  document.getElementById("fType").innerHTML=`<option value="">All types</option>`+TYPES.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("fImpact").innerHTML=`<option value="">All impact</option>`+IMPACT.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("fArche").innerHTML=`<option value="">All customers</option>`+archOpts.map(x=>`<option>${esc(x)}</option>`).join("");
  document.getElementById("sortSel").innerHTML=[["start","Start date"],["impact","Impact"],["effort","Effort (low→high)"],["updated","Recently updated"],["archetype","Customer"],["name","Name (A–Z)"]].map(([v,l])=>`<option value="${v}" ${v===sortBy?'selected':''}>${l}</option>`).join("");
  const dl=document.getElementById("archeList");if(dl)dl.innerHTML=archOpts.map(x=>`<option value="${esc(x)}">`).join("");
  updateFilterCount();
}
function updateFilterCount(){const n=["status","type","impact","archetype"].filter(k=>filters[k]).length;const b=document.getElementById("filterBtn"),c=document.getElementById("fCount");if(!b)return;c.textContent=n;b.classList.toggle("has",n>0);}
function renderRoadmap(){renderStrip();if(roadView==="priority")renderPriority();else renderTimeline();}
function renderAll(){renderRoadmap();renderMethodology();renderLearnings();renderStandups();}

function wire(){
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>switchView(b.getAttribute("data-v"))));
  document.getElementById("addBtn").addEventListener("click",()=>{if(window._view==="learnings")openCall(null);else if(window._view==="methodology")openMeth(null);else if(window._view==="standups")openStandup(null);else openEdit(null);});
  document.getElementById("addCallBtn").addEventListener("click",()=>openCall(null));
  document.getElementById("addStandupBtn").addEventListener("click",()=>openStandup(null));
  document.getElementById("closeStandup").addEventListener("click",closeStandup);document.getElementById("cancelStandup").addEventListener("click",closeStandup);document.getElementById("scrim4").addEventListener("click",closeStandup);
  document.getElementById("saveStandup").addEventListener("click",saveStandup);document.getElementById("delStandupBtn").addEventListener("click",deleteStandup);
  document.getElementById("addMethBtn").addEventListener("click",()=>openMeth(null));
  document.getElementById("closeDrawer").addEventListener("click",closeEdit);document.getElementById("cancelBtn").addEventListener("click",closeEdit);document.getElementById("scrim").addEventListener("click",closeEdit);
  document.getElementById("saveBtn").addEventListener("click",saveEdit);document.getElementById("deleteBtn").addEventListener("click",deleteItem);
  document.getElementById("closeMeth").addEventListener("click",closeMeth);document.getElementById("cancelMeth").addEventListener("click",closeMeth);document.getElementById("scrim3").addEventListener("click",closeMeth);
  document.getElementById("saveMeth").addEventListener("click",saveMeth);document.getElementById("delMethBtn").addEventListener("click",delMeth);
  document.getElementById("closeCall").addEventListener("click",closeCall);document.getElementById("cancelCall").addEventListener("click",closeCall);document.getElementById("scrim2").addEventListener("click",closeCall);
  document.getElementById("saveCall").addEventListener("click",saveCall);document.getElementById("delCallBtn").addEventListener("click",deleteCall);
  document.getElementById("cParseBtn").addEventListener("click",applyParsedNotes);
  document.getElementById("whoBtn").addEventListener("click",()=>{const n=prompt("Your name — shown on tasks you add or edit:",currentUser||"");if(n!==null)setUser(n);});
  document.getElementById("exportBtn").addEventListener("click",exportJSON);
  document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change",e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value="";});
  document.querySelectorAll("#prdTabs button").forEach(b=>b.addEventListener("click",()=>{prdTab=b.getAttribute("data-t");renderPRD();}));
  document.getElementById("prdFileInput").addEventListener("change",e=>{if(e.target.files[0])readPRDFile(e.target.files[0]);e.target.value="";});
  document.getElementById("fStatus").addEventListener("change",e=>{filters.status=e.target.value;updateFilterCount();renderRoadmap();});
  document.getElementById("fType").addEventListener("change",e=>{filters.type=e.target.value;updateFilterCount();renderRoadmap();});
  document.getElementById("fImpact").addEventListener("change",e=>{filters.impact=e.target.value;updateFilterCount();renderRoadmap();});
  document.getElementById("fArche").addEventListener("change",e=>{filters.archetype=e.target.value;updateFilterCount();renderRoadmap();});
  document.getElementById("search").addEventListener("input",e=>{filters.q=e.target.value;renderRoadmap();});
  document.getElementById("sortSel").addEventListener("change",e=>{sortBy=e.target.value;renderRoadmap();});
  document.querySelectorAll("#viewSeg button").forEach(b=>b.addEventListener("click",()=>switchRoadView(b.getAttribute("data-rv"))));
  document.querySelectorAll("#rangeSeg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#rangeSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");TIMEUNIT=b.getAttribute("data-u");renderTimeline();}));
  const fpop=document.getElementById("filterPop");
  document.getElementById("filterBtn").addEventListener("click",e=>{e.stopPropagation();fpop.hidden=!fpop.hidden;});
  fpop.addEventListener("click",e=>e.stopPropagation());
  document.getElementById("filterDone").addEventListener("click",()=>{fpop.hidden=true;});
  document.getElementById("clearFilters").addEventListener("click",()=>{filters.status=filters.type=filters.impact=filters.archetype="";document.getElementById("fStatus").value="";document.getElementById("fType").value="";document.getElementById("fImpact").value="";document.getElementById("fArche").value="";updateFilterCount();renderRoadmap();});
  document.addEventListener("click",()=>{if(!fpop.hidden)fpop.hidden=true;});
  document.querySelectorAll("#methSeg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#methSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");methFilter=b.getAttribute("data-f");renderMethodology();}));
  document.getElementById("methSearch").addEventListener("input",e=>{methQ=e.target.value;renderMethodology();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeEdit();closeCall();closeMeth();closeStandup();}});
  window.addEventListener("hashchange",()=>{const v=viewFromHash();if(v!==window._view)switchView(v);});
  window.addEventListener("resize",()=>{if(window._view==="roadmap")positionNowLine();});
}
(async function(){window._view="roadmap";renderFilterOptions();renderLegend();wire();
  try{const gl=document.getElementById("gateLogo");if(gl)gl.src=LOGO;}catch(e){}
  if(REMOTE_ON){const ok=await ensureGate();if(!ok)return;}
  await load();await loadGtm();renderIdentity();renderAll();switchView(viewFromHash());
  if(REMOTE_ON){setInterval(remotePoll,15000);window.addEventListener("focus",remotePoll);document.addEventListener("visibilitychange",()=>{if(!document.hidden)remotePoll();});}
})();
