:root{
  /* Climes palette */
  --purple:#8940C9; --purple-2:#805CB3; --green:#01A77A; --coral:#DE6D3B;
  --blue:#120C3A; --grey:#DDDDDD; --white:#FFFFFF; --lav:#F4F2FA; --muted:#6B6680;
  /* semantic surfaces (light only) — higher contrast */
  --bg:#EEEBF6; --panel:#FFFFFF; --panel-2:#E6E1F3; --panel-3:#D8D1EC;
  --line:#C9C1E0; --line-soft:#DAD3EC;
  --ink:#0C0827; --ink-dim:#514B6E; --ink-faint:#736D8C;
  --accent:var(--purple); --accent-soft:rgba(137,64,201,.1);
  --signal:var(--green); --signal-soft:rgba(1,167,122,.13);
  --shadow:0 6px 22px rgba(18,12,58,.14);
  --barText:#FFFFFF;
  /* work-item statuses — deepened for contrast on light bg */
  --s-notstarted:#8f88a8; --s-discovery:#a9781a; --s-design:#C4551F;
  --s-progress:#7A2FB8; --s-review:#6A4A9E; --s-qa:#a9781a;
  --s-shipped:#018A65; --s-parked:#8f88a8;
  /* methodology */
  --done:#018A65; --verify:#7A2FB8; --notstart:#8f88a8;
  --scope1:#7A2FB8; --scope2:#6A4A9E; --scope3:#018A65;
  --pain-high:#C4551F; --pain-med:#a9781a; --pain-low:#8f88a8;
  --radius:8px;
  --namew:240px;
  --mono:'Author Medium','Author',ui-monospace,monospace;
  --sans:'Author','Myriad Pro',system-ui,sans-serif;
  --semi:'Author Semibold','Author',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--green);color:#fff}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
h1,h2,h3{font-family:var(--sans);font-weight:700}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;gap:20px;padding:15px 30px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:20}
.brand-logo{height:26px;width:auto;display:block}
.brand-div{width:1px;height:30px;background:var(--line);margin:0 2px}
.brand{display:flex;flex-direction:column;gap:1px}
.brand .eyebrow{font-family:var(--semi);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:600}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--blue)}
nav.tabs{display:flex;gap:3px;background:var(--lav);padding:4px;border-radius:10px;border:1px solid var(--line)}
nav.tabs button{background:none;border:0;color:var(--ink-dim);padding:8px 16px;border-radius:7px;font-size:13px;font-weight:500;font-family:var(--sans);display:flex;align-items:center;gap:7px;transition:.15s}
nav.tabs button svg{width:15px;height:15px}
nav.tabs button:hover{color:var(--blue)}
nav.tabs button.on{background:var(--white);color:var(--purple);font-weight:600;box-shadow:0 1px 3px rgba(18,12,58,.1)}
.spacer{flex:1}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{background:var(--white);border:1px solid var(--line);color:var(--ink-dim);padding:8px 13px;border-radius:var(--radius);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--purple);color:var(--purple)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:14px;height:14px}

/* ===== views ===== */
.view{display:none}.view.on{display:block}

/* ===== summary strip ===== */
.strip{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--white);overflow-x:auto}
.stat{padding:14px 24px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px;min-width:108px}
.stat .n{font-family:var(--sans);font-weight:700;font-size:21px;color:var(--blue)}
.stat .l{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-family:var(--semi);font-weight:600}
.stat .n.accent{color:var(--green)}
.stat .n.purple{color:var(--purple)}

/* ===== controls ===== */
.controls{display:flex;gap:10px;align-items:center;padding:13px 30px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--white)}
.controls .grp{display:flex;gap:6px;align-items:center}
.controls label{font-size:10px;color:var(--ink-faint);font-family:var(--semi);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.controls select,.controls input[type=search],.mc input{background:var(--lav);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:7px;font-size:12.5px}
.controls input[type=search]{min-width:190px}
.controls .spacer2{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--white);border:0;color:var(--ink-dim);padding:7px 13px;font-size:12px;border-right:1px solid var(--line);font-family:var(--sans)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--purple);color:#fff;font-weight:600}

/* ===== legend ===== */
.legend{display:flex;gap:15px;flex-wrap:wrap;padding:15px 30px 0;color:var(--ink-faint);font-size:11px;font-family:var(--mono)}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(18,12,58,.12)}

/* ===== TIMELINE ===== */
.timeline-wrap{padding:8px 0 60px}
.tl-scroll{overflow-x:auto;padding:0 30px}
.tl{min-width:820px;position:relative}
.tl-head{display:grid;position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding-top:14px}
.tl-head .lane-label{padding:0 0 10px 2px}
.qcol{text-align:center;padding:6px 4px 10px;border-left:1px solid var(--line-soft);font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);letter-spacing:.03em}
.qcol .yr{display:block;font-size:9.5px;color:var(--ink-faint);margin-top:2px}
.qcol.now{color:var(--green)} .qcol.now .yr{color:var(--green)}
.horizon{margin-top:6px}
.horizon-label{display:flex;align-items:center;gap:9px;padding:15px 2px 8px}
.horizon-label .dot{width:8px;height:8px;border-radius:50%}
.horizon-label .txt{font-family:var(--semi);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.horizon-label .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.horizon-label .rule{flex:1;height:1px;background:var(--line-soft)}
.row{display:grid;align-items:center;position:relative;min-height:44px;border-bottom:1px solid var(--line-soft)}
.row:hover{background:var(--panel-2)}
.row .namecell{padding:7px 12px 7px 2px;display:flex;flex-direction:column;gap:2px;position:sticky;left:0;z-index:2;background:var(--bg)}
.row:hover .namecell{background:var(--panel-2)}
.namecell .nm{font-size:15px;font-weight:500;color:var(--blue);line-height:1.3;cursor:pointer;letter-spacing:-.005em}
.namecell .nm:hover{color:var(--purple)}
.namecell .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);font-weight:500}
.tag.type{color:var(--blue);background:var(--panel-2)}
.tag.impact{color:var(--ink-dim)}
.impact-3{color:var(--green) !important;border-color:var(--green) !important}
.lane{position:relative;height:44px}
.lane .grid{position:absolute;inset:0;display:grid;pointer-events:none}
.lane .grid span{border-left:1px solid var(--line)}
.lane .grid span.now{background:var(--signal-soft)}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:5px;display:flex;align-items:center;padding:0 9px;gap:7px;cursor:pointer;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;border:1px solid rgba(12,8,39,.22);box-shadow:0 1px 2px rgba(18,12,58,.14);transition:.12s}
.bar:hover{filter:brightness(1.05);box-shadow:0 0 0 1px var(--purple)}
.bar .eff{font-family:var(--mono);font-size:9px;opacity:.8;font-weight:600}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--green);z-index:4;pointer-events:none}
.nowline::after{content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-family:var(--semi);font-weight:600;font-size:8.5px;letter-spacing:.1em;color:var(--green);white-space:nowrap}
.nowline.first::after{content:'TODAY'}
.empty{padding:60px 30px;text-align:center;color:var(--ink-faint)}
.empty h3{color:var(--ink-dim);font-weight:600;margin:0 0 6px}

/* ===== METHODOLOGY ===== */
.meth-wrap{padding:20px 30px 60px}
.prog-track{height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.prog-track .fill{height:100%}
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:8px}
.scope-card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scope-card .accent-bar{height:4px}
.scope-card .sc-head{padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.scope-card .sc-head .badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:14px;color:#fff}
.scope-card .sc-head .t{flex:1}
.scope-card .sc-head .t .nm{font-weight:700;font-size:14px;color:var(--blue)}
.scope-card .sc-head .t .su{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.scope-card .sc-head .pct{font-family:var(--sans);font-weight:700;font-size:20px}
.sc-prog{padding:12px 18px 4px}
.sc-prog .prog-track{height:7px}
.sc-list{padding:8px 8px 12px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.mrow:hover{background:var(--panel-2)}
.mrow .stat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.mrow .mid{flex:1;min-width:0}
.mrow .mid .mname{font-size:12px;font-weight:500;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue)}
.mrow .mid .mnote{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mdue{font-family:var(--mono);font-size:10px;color:var(--ink-dim);flex-shrink:0;display:flex;align-items:center;gap:3px}
.mrow .mdue svg{width:10px;height:10px;opacity:.6}
.mrow .mstat{font-family:var(--semi);font-weight:600;font-size:9.5px;letter-spacing:.03em;padding:2px 8px;border-radius:5px;flex-shrink:0;text-transform:uppercase}
.mstat.done{background:rgba(1,167,122,.13);color:var(--green)}
.mstat.verify{background:rgba(137,64,201,.13);color:var(--purple)}
.mstat.other{background:var(--panel-3);color:var(--ink-dim)}
.mrow .edit-hint{opacity:0;flex-shrink:0;color:var(--ink-faint);transition:.12s}
.mrow:hover .edit-hint{opacity:1}
.mrow .edit-hint svg{width:13px;height:13px;display:block}
.cat-pill{font-family:var(--mono);font-size:9px;color:var(--ink-faint);padding:1px 5px;border:1px solid var(--line);border-radius:4px;flex-shrink:0}
.meth-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.meth-controls .mc input{min-width:210px}
.due-soon{color:var(--coral) !important}

/* ===== LEARNINGS ===== */
.learn-wrap{padding:20px 30px 60px;display:grid;grid-template-columns:1fr;gap:24px}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 13px}
.sec-title h2{margin:0;font-size:15px;font-weight:700;color:var(--blue)}
.sec-title .kick{font-family:var(--semi);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sec-title .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);background:var(--panel-2);padding:2px 8px;border-radius:5px}
.sec-title .rule{flex:1;height:1px;background:var(--line-soft)}
.call-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.call-card{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:0 16px 15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.14s;overflow:hidden;box-shadow:var(--shadow)}
.call-card .topaccent{height:3px;margin:0 -16px 13px;background:var(--green)}
.call-card:hover{border-color:var(--purple)}
.call-card .ch{display:flex;align-items:center;gap:8px}
.call-card .cust{font-weight:700;font-size:14px;color:var(--blue)}
.call-card .date{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:auto}
.call-card .quote{font-size:13px;line-height:1.5;color:var(--ink);border-left:2px solid var(--green);padding-left:11px;font-style:italic}
.call-card .insight{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
.call-card .insight b{color:var(--purple);font-weight:600;font-style:normal}
.call-card .cf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.su-notes{font-size:12.5px;line-height:1.55;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--blue);font-weight:500}
.chip.theme{background:var(--lav)}
.chip.pain-High{color:var(--coral);border-color:rgba(222,109,59,.4)}
.chip.pain-Medium{color:#b8901f;border-color:rgba(201,162,39,.4)}
.chip.pain-Low{color:var(--ink-faint)}
.chip.link{color:var(--purple);border-color:rgba(137,64,201,.4);cursor:pointer}
.chip.prio{font-weight:600;font-family:var(--semi);background:var(--panel-2);color:var(--purple)}
.build-table{background:var(--white);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.build-table table{width:100%;border-collapse:collapse}
.build-table th{text-align:left;font-family:var(--semi);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:11px 14px;border-bottom:1px solid var(--line);background:var(--lav)}
.build-table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top}
.build-table tr:last-child td{border-bottom:0}
.build-table tr:hover td{background:var(--panel-2)}
.build-table .bname{font-weight:600;color:var(--blue)}
.build-table .bwhy{color:var(--ink-dim);font-size:12px;max-width:340px}
.askcount{font-family:var(--sans);font-weight:700;color:var(--green)}

/* ===== owner avatars ===== */
.avatar{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--semi);font-weight:600;font-size:8.5px;color:#fff;flex-shrink:0;letter-spacing:.02em}
.avatar.sm{width:17px;height:17px;font-size:7.5px}
.tag.owner{display:inline-flex;align-items:center;gap:4px;background:var(--panel-2);color:var(--blue);border-color:var(--line);padding:1px 6px 1px 2px}
.tag.owner .avatar{width:14px;height:14px;font-size:7px}
/* owner multi-select in drawer */
.owner-select{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.owner-chip{display:inline-flex;align-items:center;gap:6px;background:var(--lav);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;font-size:12.5px;cursor:pointer;transition:.12s;color:var(--ink-dim)}
.owner-chip:hover{border-color:var(--purple)}
.owner-chip.on{background:rgba(137,64,201,.1);border-color:var(--purple);color:var(--blue);font-weight:600}
.owner-chip .x2{margin-left:1px;color:var(--ink-faint);font-size:13px;line-height:1}
.owner-add{display:inline-flex;align-items:center;gap:4px;background:none;border:1px dashed var(--line);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--ink-dim);font-family:var(--sans)}
.owner-add:hover{border-color:var(--purple);color:var(--purple)}
.owner-add svg{width:12px;height:12px}
/* PRD block */
.prd-box{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--lav)}
.prd-tabs{display:flex;border-bottom:1px solid var(--line)}
.prd-tabs button{flex:1;background:none;border:0;border-right:1px solid var(--line);padding:9px 0;font-size:12px;color:var(--ink-dim);font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:6px}
.prd-tabs button:last-child{border-right:0}
.prd-tabs button svg{width:13px;height:13px}
.prd-tabs button.on{background:var(--white);color:var(--purple);font-weight:600}
.prd-body{padding:12px}
.prd-body input,.prd-body textarea{background:var(--white)}
.prd-drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--ink-dim);font-size:12.5px;cursor:pointer;transition:.14s;background:var(--white)}
.prd-drop:hover,.prd-drop.drag{border-color:var(--purple);color:var(--purple);background:rgba(137,64,201,.04)}
.prd-drop svg{width:20px;height:20px;display:block;margin:0 auto 7px;opacity:.6}
.prd-file{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--white);border:1px solid var(--line);border-radius:8px}
.prd-file .fi{width:30px;height:30px;border-radius:7px;background:rgba(137,64,201,.12);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prd-file .fi svg{width:15px;height:15px}
.prd-file .fmeta{flex:1;min-width:0}
.prd-file .fname{font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prd-file .fsize{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
.prd-file .fx{background:none;border:0;color:var(--ink-faint);font-size:18px;padding:0 4px}
.prd-file .fx:hover{color:var(--coral)}
/* PRD indicator on cards/rows */
.prd-badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;color:var(--purple);background:rgba(137,64,201,.1);border:1px solid rgba(137,64,201,.28);padding:1px 6px;border-radius:4px;cursor:pointer;font-weight:600}
.prd-badge svg{width:9px;height:9px}
.namecell .meta .prd-badge:hover{filter:brightness(.95)}

/* ===== drawers ===== */
.scrim{position:fixed;inset:0;background:rgba(18,12,58,.32);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--white);border-left:1px solid var(--line);z-index:50;transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer h2{margin:0;font-size:16px;font-weight:700;color:var(--blue)}
.drawer .dsub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:2px}
.drawer .dh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.drawer .db{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:15px}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-family:var(--semi);font-weight:600;letter-spacing:.06em;color:var(--ink-dim);text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--lav);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:7px;font-size:13px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--purple)}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.audit-block{background:var(--lav);border:1px solid var(--line);border-radius:7px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.5;color:var(--ink-dim)}
.audit-block .ak{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-right:2px}
.audit-block b{color:var(--ink);font-weight:600}
.audit-block .am{color:var(--ink-faint)}
.audit-hint{font-family:var(--mono);font-size:9px;color:var(--ink-faint);white-space:nowrap;display:inline-flex;align-items:center}
.btn.who{gap:6px}
.btn.who .who-dot{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;font-family:var(--semi);background:var(--ink-faint)}
.btn.who.set #whoLabel{font-weight:600;color:var(--ink)}
.field .hint{font-size:10.5px;color:var(--ink-faint);text-transform:none;letter-spacing:0;font-family:var(--sans)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.x{background:none;border:0;color:var(--ink-faint);font-size:22px;line-height:1;padding:0 4px}
.x:hover{color:var(--blue)}
.del-link{background:none;border:0;color:var(--coral);font-size:12px;padding:6px 2px}
.del-link:hover{text-decoration:underline}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{flex:1;background:var(--lav);border:1px solid var(--line);color:var(--ink-dim);padding:8px 0;border-radius:7px;font-size:12px;font-family:var(--mono);min-width:44px}
.pick button.on{background:rgba(137,64,201,.12);border-color:var(--purple);color:var(--purple)}
.pick.multi button{flex:0 1 auto;padding:7px 11px}
.statuspick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.statuspick button{display:flex;align-items:center;gap:7px;background:var(--lav);border:1px solid var(--line);color:var(--ink-dim);padding:9px 11px;border-radius:7px;font-size:12.5px;font-family:var(--sans);text-align:left}
.statuspick button .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.statuspick button.on{border-color:var(--purple);background:rgba(137,64,201,.08);color:var(--blue);font-weight:600}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--purple);color:#fff;font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:8px;z-index:60;opacity:0;transition:.22s;font-family:var(--sans)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== controls v2: filter & sort, view + range ===== */
.controls{justify-content:space-between;position:relative}
.ctl-left,.ctl-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl-lab{font-size:10px;color:var(--ink-faint);font-family:var(--semi);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
select.mini{background:var(--lav);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:7px;font-size:12.5px}
.viewseg button svg{width:13px;height:13px;margin-right:5px;vertical-align:-2px}
.ftbtn{position:relative}
.ftbtn .fcount{background:var(--purple);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;min-width:16px;text-align:center;display:none}
.ftbtn.has .fcount{display:inline-block}
.filter-pop{position:absolute;top:calc(100% + 6px);right:30px;z-index:15;background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;width:min(320px,92vw);display:flex;flex-direction:column;gap:11px}
.filter-pop .fp-row{display:flex;flex-direction:column;gap:5px}
.filter-pop label{font-size:10px;color:var(--ink-faint);font-family:var(--semi);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.filter-pop select{background:var(--lav);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:7px;font-size:13px;width:100%}
.filter-pop .fp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.filter-pop .clear{background:none;border:0;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:0}
.filter-pop .clear:hover{color:var(--purple)}
.stat.wide{min-width:170px}
.stat.wide .n.small{font-size:14px;font-weight:600;color:var(--ink)}
.tag.arche{color:#fff;border:0;font-weight:600}
/* ===== priority (impact × effort) matrix ===== */
.priority-wrap{padding:16px 30px 60px}
.pm-scroll{overflow-x:auto}
.pm{display:grid;grid-template-columns:96px repeat(5,minmax(120px,1fr));gap:7px;min-width:720px}
.pm-corner{display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--semi);font-weight:600;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
.pm-corner .pm-x{color:var(--ink-faint)}
.pm-colh{text-align:center;font-family:var(--semi);font-weight:600;font-size:11px;color:var(--ink-dim);padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.pm-rowh{display:flex;align-items:center;font-family:var(--semi);font-weight:600;font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em}
.pm-cell{min-height:74px;border:1px solid var(--line-soft);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--white)}
.pm-cell.q-win{background:rgba(1,167,122,.09);border-color:rgba(1,167,122,.3)}
.pm-cell.q-bet{background:rgba(137,64,201,.08);border-color:rgba(137,64,201,.28)}
.pm-cell.q-fill{background:var(--lav)}
.pm-cell.q-drop{background:rgba(222,109,59,.08);border-color:rgba(222,109,59,.26)}
.pm-chip{font-size:11px;font-weight:600;color:#fff;padding:3px 8px;border-radius:5px;cursor:pointer;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 2px rgba(18,12,58,.12)}
.pm-chip:hover{filter:brightness(1.06);box-shadow:0 0 0 1px var(--purple)}
.pm-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11px;font-family:var(--mono);color:var(--ink-faint)}
.pm-legend .k{display:inline-flex;align-items:center;gap:6px}
.pm-legend .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
/* ===== password gate ===== */
.gate{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#EEEBF6,#E1DAF0);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 30px;width:min(380px,94vw);text-align:center;display:flex;flex-direction:column;gap:12px}
.gate-card .glogo{height:28px;width:auto;margin:0 auto 4px}
.gate-card h2{margin:0;font-size:17px;color:var(--blue);font-weight:700}
.gate-card p{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.5}
.gate-card input{background:var(--lav);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;width:100%;text-align:center}
.gate-card input:focus{outline:none;border-color:var(--purple)}
.gate-card button{background:var(--purple);color:#fff;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:600}
.gate-card button:hover{filter:brightness(1.07)}
.gate-err{color:var(--coral);font-size:12px;font-weight:600;min-height:14px}
.gate-hint{font-size:11px;color:var(--ink-faint);line-height:1.45}
/* ===== learnings v2: pain-point analytics, exec table, source links ===== */
.pain-panel{margin-bottom:26px}
.theme-panel{margin-bottom:26px}
.signal-row{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;margin-bottom:24px}
.signal-row .pain-panel,.signal-row .theme-panel{margin-bottom:0;min-width:0}
.signal-row .pain-bars,.signal-row .pull-bars,.signal-row .pain-sub,.signal-row .pull-gtm,.signal-row .pain-legend,.signal-row .pull-themes{max-width:none}
.signal-row .pull-lab,.signal-row .pain-lab{font-size:12px}
.pain-sub{font-size:12px;color:var(--ink-dim);margin:2px 0 14px;max-width:780px;line-height:1.5}
.pain-sub b{color:var(--ink)}
.pain-bars{display:flex;flex-direction:column;gap:9px;max-width:780px}
.pain-row{display:grid;grid-template-columns:150px 1fr 30px;align-items:center;gap:12px}
.pain-lab{font-size:12px;color:var(--ink-dim);text-align:right;font-family:var(--semi);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pain-track{display:flex;height:20px;border-radius:5px;overflow:hidden;min-width:5px;box-shadow:inset 0 0 0 1px var(--line-soft)}
.pain-track .pseg{display:block;min-width:2px}
.pain-num{font-family:var(--mono);font-size:12px;color:var(--ink-dim);font-weight:600}
.pain-legend{display:flex;gap:16px;margin-top:13px;font-size:11px;font-family:var(--mono);color:var(--ink-faint)}
.pain-legend .k{display:inline-flex;align-items:center;gap:6px}
.pain-legend .sw{width:11px;height:11px;border-radius:3px}
.learn-table{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:22px}
.learn-table table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
.learn-table th{text-align:left;padding:9px 12px;background:var(--panel-2);color:var(--ink-dim);font-family:var(--semi);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.learn-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-dim)}
.learn-table tr:last-child td{border-bottom:0}
.learn-table tr[data-goto]{cursor:pointer}
.learn-table tr[data-goto]:hover td{background:var(--panel-2)}
.learn-table .lc-cust{font-weight:600;color:var(--ink)}
.learn-table .lc-date{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.notes-link{color:var(--purple);text-decoration:none;font-weight:600;white-space:nowrap}
.notes-link:hover{text-decoration:underline}
.chip.notes{background:var(--accent-soft);color:var(--purple);text-decoration:none;border-color:transparent}
.chip.notes:hover{text-decoration:underline}
.call-card{scroll-margin-top:100px}
.call-card.flash{box-shadow:0 0 0 2px var(--purple)}
.paste-parse{background:var(--lav);border:1px dashed var(--line);border-radius:9px;padding:11px}
.paste-parse textarea{min-height:66px}
.paste-parse .btn{align-self:flex-start;margin-top:8px}
.pull-bars{display:flex;flex-direction:column;gap:9px;max-width:840px}
.pull-row{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:center}
.pull-lab{font-size:12.5px;color:var(--ink);text-align:right;font-family:var(--semi);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pull-track{height:22px;background:var(--panel-2);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-soft)}
.pull-fill{height:100%;border-radius:6px;min-width:3px}
.pull-tags{display:flex;align-items:center;gap:7px;white-space:nowrap}
.pull-score{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink);min-width:26px;text-align:right}
.pull-themes{margin-top:15px;font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:840px}
.pull-themes .pt-lab{font-family:var(--semi);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-right:2px}
.chip.ind{background:var(--panel-3);color:var(--ink-dim)}
.chip.demo{background:var(--signal-soft);color:var(--green);text-decoration:none;border-color:transparent}
.chip.demo:hover{text-decoration:underline}
.chip.gtm{background:color-mix(in srgb,var(--purple-2) 16%,transparent);color:var(--purple-2);border-color:transparent}
.pull-gtm{margin-top:14px;font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);max-width:840px;line-height:1.5}
.pull-gtm .pt-lab{font-family:var(--semi);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--ink-faint);margin-right:6px}
.pull-gtm .gtm-when{color:var(--ink-faint)}

@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:14px 16px;gap:10px}
  .topbar .spacer{display:none}
  .brand h1{font-size:15px}
  nav.tabs{order:3;width:100%;overflow-x:auto}
  nav.tabs button{flex:1;justify-content:center;white-space:nowrap}
  .toolbar{order:4;width:100%;flex-wrap:wrap}
  .toolbar .btn{flex:1;justify-content:center}
  .controls{padding:12px 16px;gap:10px}
  .controls .ctl-left,.controls .ctl-right{width:100%}
  .controls .ctl-right #search{flex:1;min-width:0}
  .meth-wrap,.learn-wrap,.tl-scroll{padding-left:16px;padding-right:16px}
  .priority-wrap{padding:14px 16px 50px}
  .filter-pop{right:16px;left:16px;width:auto}
  :root{--namew:150px}
  .stat{padding:12px 16px;min-width:96px}
  .namecell .nm{font-size:14px}
  .pain-row{grid-template-columns:84px 1fr 24px;gap:8px}
  .pain-lab{font-size:11px}
  .pull-row{grid-template-columns:92px 1fr;gap:8px}
  .pull-lab{font-size:11px}
  .pull-tags{grid-column:2;justify-content:flex-start}
  .signal-row{grid-template-columns:1fr;gap:24px}
}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <img class="glogo" id="gateLogo" alt="Climes">
    <h2>CarbonOS · Product Dashboard</h2>
    <p id="gateMsg">Enter the team password to continue.</p>
    <input type="password" id="gateInput" placeholder="Password" autocomplete="current-password">
    <button id="gateBtn">Unlock</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-hint" id="gateHint"></div>
  </div>
</div>
<div class="topbar">
  <img class="brand-logo" id="brandLogo" alt="Climes">
  <div class="brand-div"></div>
  <div class="brand"><span class="eyebrow">CarbonOS</span><h1>Product Dashboard</h1></div>
  <nav class="tabs" id="tabs">
    <button data-v="roadmap" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Roadmap</button>
    <button data-v="methodology"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Methodology</button>
    <button data-v="learnings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Learnings</button>
    <button data-v="standups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>Standups</button>
  </nav>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="btn who" id="whoBtn" title="Set the name shown on tasks you add or edit"><span class="who-dot" id="whoDot"></span><span id="whoLabel">Set your name</span></button>
    <button class="btn" id="importBtn" title="Load a backup file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Import</button>
    <button class="btn" id="exportBtn" title="Download a backup file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/></svg>Export</button>
    <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span id="addLabel">Add item</span></button>
  </div>
</div>

<!-- ROADMAP -->
<section class="view on" id="view-roadmap">
  <div class="strip" id="strip"></div>
  <div class="controls">
    <div class="ctl-left">
      <div class="seg viewseg" id="viewSeg">
        <button data-rv="timeline" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Timeline</button>
        <button data-rv="priority"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-9"/></svg>Priority</button>
      </div>
      <div class="grp" id="rangeGrp"><label class="ctl-lab">Zoom</label>
        <div class="seg" id="rangeSeg"><button data-u="week">Week</button><button data-u="month">Month</button><button data-u="quarter" class="on">Quarter</button><button data-u="year">Year</button></div>
      </div>
    </div>
    <div class="ctl-right">
      <label class="ctl-lab">Sort</label>
      <select id="sortSel" class="mini"></select>
      <button class="btn ftbtn" id="filterBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filter <span class="fcount" id="fCount"></span></button>
      <input type="search" id="search" placeholder="Search…">
    </div>
    <div class="filter-pop" id="filterPop" hidden>
      <div class="fp-row"><label>Status</label><select id="fStatus"></select></div>
      <div class="fp-row"><label>Type</label><select id="fType"></select></div>
      <div class="fp-row"><label>Impact</label><select id="fImpact"></select></div>
      <div class="fp-row"><label>Customer / Archetype</label><select id="fArche"></select></div>
      <div class="fp-foot"><button class="clear" id="clearFilters">Clear all</button><button class="btn primary" id="filterDone">Done</button></div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="timeline-wrap" id="timelineWrap"><div class="tl-scroll"><div class="tl" id="tl"></div></div></div>
  <div class="priority-wrap" id="priorityWrap" hidden></div>
</section>

<!-- METHODOLOGY -->
<section class="view" id="view-methodology">
  <div class="strip" id="methStrip"></div>
  <div class="meth-wrap">
    <div class="meth-controls">
      <div class="grp"><label style="font-family:var(--semi);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)">Show</label>
        <div class="seg" id="methSeg"><button data-f="all" class="on">All</button><button data-f="Verification">In verification</button><button data-f="Done">Done</button></div></div>
      <div class="grp mc"><input type="search" id="methSearch" placeholder="Search methodologies…"></div>
      <div class="spacer2"></div>
      <button class="btn" id="addMethBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg>Add methodology</button>
    </div>
    <div class="scope-grid" id="scopeGrid"></div>
  </div>
</section>

<!-- LEARNINGS -->
<section class="view" id="view-learnings">
  <div class="strip" id="learnStrip"></div>
  <div class="learn-wrap">
    <div class="signal-row">
      <div class="theme-panel" id="themePanel"></div>
      <div class="pain-panel" id="painPanel"></div>
    </div>
    <div>
      <div class="sec-title"><span class="kick">From the field</span><h2>Call Log</h2><span class="cnt" id="callCnt">0</span><span class="rule"></span>
        <button class="btn" id="addCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg>Log a call</button></div>
      <div class="learn-table-wrap" id="callTableWrap"></div>
      <div class="call-grid" id="callGrid"></div>
    </div>
  </div>
</section>

<!-- STANDUPS -->
<section class="view" id="view-standups">
  <div class="strip" id="standupStrip"></div>
  <div class="learn-wrap">
    <div>
      <div class="sec-title"><span class="kick">Product cadence</span><h2>Standup Notes</h2><span class="cnt" id="standupCnt">0</span><span class="rule"></span>
        <button class="btn" id="addStandupBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg>Add standup</button></div>
      <div class="call-grid" id="standupGrid"></div>
    </div>
  </div>
</section>

<!-- standup drawer -->
<div class="scrim" id="scrim4"></div>
<div class="drawer" id="standupDrawer">
  <div class="dh"><div><h2 id="standupTitle">Add standup</h2></div><button class="x" id="closeStandup">×</button></div>
  <div class="db">
    <div class="two"><div class="field"><label>Date</label><input id="sDate" type="date"></div><div class="field"><label>Who was there <span class="hint">— optional</span></label><input id="sPresent" placeholder="e.g. Romaa, Dev, PM" autocomplete="off"></div></div>
    <div class="field"><label>Notes <span class="hint">— paste the full standup notes here</span></label><textarea id="sNotes" placeholder="What we discussed, decisions, blockers, action items…" style="min-height:220px"></textarea></div>
    <div class="field"><label>Notes link <span class="hint">— optional, if notes live elsewhere</span></label><input id="sSource" type="url" placeholder="https://…" autocomplete="off"></div>
  </div>
  <div class="df"><button class="del-link" id="delStandupBtn">Delete standup</button><div style="display:flex;gap:9px"><button class="btn" id="cancelStandup">Cancel</button><button class="btn primary" id="saveStandup">Save</button></div></div>
</div>

<!-- roadmap drawer -->
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><div><h2 id="drawerTitle">New item</h2></div><button class="x" id="closeDrawer">×</button></div>
  <div class="db">
    <div class="field"><label>Item name</label><input id="fName" placeholder="e.g. SBTi progress dashboard" autocomplete="off"></div>
    <div class="field"><label>What & why</label><textarea id="fNotes" placeholder="What it is, the customer learning behind it…"></textarea></div>
    <div class="two"><div class="field"><label>Type</label><select id="fTypeSel"></select></div><div class="field"><label>Status</label><select id="fStatusSel"></select></div></div>
    <div class="field"><label>Impact</label><div class="pick" id="fImpactPick"></div></div>
    <div class="field"><label>Effort</label><div class="pick" id="fEffortPick"></div></div>
    <div class="two"><div class="field"><label>Start date</label><input type="date" id="fStart"></div><div class="field"><label>Target date</label><input type="date" id="fEnd"></div></div>
    <div class="field"><label>Customer / User archetype</label><input id="fArchetype" list="archeList" placeholder="e.g. Jeena, Varuna, Platform…" autocomplete="off"><datalist id="archeList"></datalist></div>
    <div class="field"><label>Owner <span class="hint">— tap to assign</span></label><div class="owner-select" id="fOwnerSelect"></div></div>
    <div class="field"><label>PRD <span class="hint">— attach a doc, link, or notes</span></label>
      <div class="prd-box">
        <div class="prd-tabs" id="prdTabs">
          <button data-t="file" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>Document</button>
          <button data-t="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>Link</button>
          <button data-t="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Text</button>
        </div>
        <div class="prd-body" id="prdBody"></div>
      </div>
    </div>
    <div class="audit-block" id="fAudit" style="display:none"></div>
  </div>
  <div class="df"><button class="del-link" id="deleteBtn">Delete item</button><div style="display:flex;gap:9px"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></div>
</div>
<input type="file" id="prdFileInput" style="display:none">

<!-- methodology drawer -->
<div class="scrim" id="scrim3"></div>
<div class="drawer" id="methDrawer">
  <div class="dh"><div><h2 id="methTitle">Edit methodology</h2><div class="dsub" id="methSub"></div></div><button class="x" id="closeMeth">×</button></div>
  <div class="db">
    <div class="field" id="methIdField"><label>Methodology ID</label><input id="mId" placeholder="e.g. S3-C05-WASTE-HAZARDOUS" autocomplete="off"></div>
    <div class="two">
      <div class="field"><label>Scope</label><select id="mScope"><option>Scope 1</option><option>Scope 2</option><option>Scope 3</option></select></div>
      <div class="field"><label>Category</label><select id="mCat"><option>Main</option><option>Sub-module</option></select></div>
    </div>
    <div class="field"><label>Status</label><div class="statuspick" id="mStatusPick"></div></div>
    <div class="two">
      <div class="field"><label>Due date <span class="hint">— optional</span></label><input id="mDue" type="date"></div>
      <div class="field"><label>Priority</label><select id="mPriority"><option>High</option><option>Medium</option><option>Low</option></select></div>
    </div>
    <div class="field"><label>Note <span class="hint">— optional</span></label><textarea id="mNote" placeholder="e.g. Adding applicability marker"></textarea></div>
  </div>
  <div class="df"><button class="del-link" id="delMethBtn">Delete</button><div style="display:flex;gap:9px"><button class="btn" id="cancelMeth">Cancel</button><button class="btn primary" id="saveMeth">Save</button></div></div>
</div>

<!-- call drawer -->
<div class="scrim" id="scrim2"></div>
<div class="drawer" id="callDrawer">
  <div class="dh"><div><h2 id="callTitle">Log a call</h2></div><button class="x" id="closeCall">×</button></div>
  <div class="db">
    <div class="field paste-parse"><label>Auto-fill from meeting notes <span class="hint">— paste the notes text (and/or the PressPlay link)</span></label>
      <textarea id="cPaste" placeholder="Paste the full meeting notes here, then click Auto-fill…"></textarea>
      <button type="button" class="btn" id="cParseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5z"/></svg>Auto-fill from notes</button>
    </div>
    <div class="two"><div class="field"><label>Customer</label><input id="cCustomer" placeholder="e.g. Varuna" autocomplete="off"></div><div class="field"><label>Date</label><input id="cDate" type="date"></div></div>
    <div class="field"><label>Attendees / role <span class="hint">— optional</span></label><input id="cAttendees" placeholder="e.g. Head of ESG (Priya)" autocomplete="off"></div>
    <div class="two"><div class="field"><label>Industry</label><input id="cIndustry" list="indList" placeholder="e.g. Banking & Finance" autocomplete="off"><datalist id="indList"></datalist></div><div class="field"><label>Sentiment</label><select id="cSentiment"></select></div></div>
    <div class="two"><div class="field"><label>Call type</label><select id="cType"></select></div><div class="field"><label>Pain level</label><select id="cPain"></select></div></div>
    <div class="field"><label>Themes / pains raised <span class="hint">— tap all that apply</span></label><div class="pick multi" id="cThemePick"></div></div>
    <div class="field"><label>What they said <span class="hint">— verbatim or paraphrase</span></label><textarea id="cQuote" placeholder="&quot;We can't see scope split at a glance…&quot;"></textarea></div>
    <div class="field"><label>Learning / insight</label><textarea id="cInsight" placeholder="What this tells us to do."></textarea></div>
    <div class="field"><label>Priority</label><select id="cPrio"></select></div>
    <div class="two"><div class="field"><label>Demo link <span class="hint">— the demo we gave</span></label><input id="cDemo" type="url" placeholder="https://customer.climes.io/" autocomplete="off"></div><div class="field"><label>Meeting notes link</label><input id="cSource" type="url" placeholder="https://pressplay.vastoo.co/…" autocomplete="off"></div></div>
    <div class="field"><label>Linked build <span class="hint">— optional roadmap item</span></label><select id="cLink"></select></div>
  </div>
  <div class="df"><button class="del-link" id="delCallBtn">Delete call</button><div style="display:flex;gap:9px"><button class="btn" id="cancelCall">Cancel</button><button class="btn primary" id="saveCall">Save</button></div></div>
</div>

<div class="toast" id="toast"></div>

/* --- real-date model: start/end are ISO YYYY-MM-DD; the timeline axis is a
      continuous month-resolution range, drawn with quarter columns for scanning --- */
const TODAY=new Date();TODAY.setHours(0,0,0,0);
function pd(s){ // parse -> Date. handles ISO dates and legacy "Q3 2026" strings
  if(!s)return null;
  if(s instanceof Date)return s;
  const iso=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);
  const qm=/^Q([1-4])\s+(\d{4})$/.exec(s);if(qm){const q=+qm[1],y=+qm[2];return new Date(y,(q-1)*3,1);}
  const d=new Date(s);return isNaN(d)?null:d;
}
function toISO(v){const d=pd(v);if(!d)return"";return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmtDate(s){const d=pd(s);if(!d)return s||"—";return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function quarterOf(d){return {y:d.getFullYear(),q:Math.floor(d.getMonth()/3)+1};}
function qStart(y,q){return new Date(y,(q-1)*3,1);}
function qEnd(y,q){return new Date(y,q*3,0);}
function qOrd(d){const c=quarterOf(d);return c.y*4+c.q;}

function recomputeAxis(){
  const dates=[TODAY];items.forEach(it=>{const s=pd(it.start),e=pd(it.end);if(s)dates.push(s);if(e)dates.push(e);});
  const min=new Date(Math.min(...dates)),max=new Date(Math.max(...dates));
  QUARTERS=[];
  if(TIMEUNIT==="year"){
    for(let y=min.getFullYear();y<=max.getFullYear();y++)QUARTERS.push({start:new Date(y,0,1),end:new Date(y,11,31),label:String(y),sub:"",now:TODAY.getFullYear()===y});
  }else if(TIMEUNIT==="month"){
    let y=min.getFullYear(),m=min.getMonth();const ey=max.getFullYear(),em=max.getMonth();
    while(y<ey||(y===ey&&m<=em)){QUARTERS.push({start:new Date(y,m,1),end:new Date(y,m+1,0),label:MON[m],sub:String(y),now:(TODAY.getFullYear()===y&&TODAY.getMonth()===m)});m++;if(m>11){m=0;y++;}}
  }else if(TIMEUNIT==="week"){
    let s=startOfWeek(min);const end=startOfWeek(max).getTime();const cw=startOfWeek(TODAY).getTime();
    while(s.getTime()<=end){QUARTERS.push({start:new Date(s),end:addDays(s,6),label:String(s.getDate()),sub:MON[s.getMonth()],now:(s.getTime()===cw)});s=addDays(s,7);}
  }else{ // quarter (default)
    const a=quarterOf(min),b=quarterOf(max);let y=a.y,q=a.q;const cq=quarterOf(TODAY);
    while(y<b.y||(y===b.y&&q<=b.q)){QUARTERS.push({start:qStart(y,q),end:qEnd(y,q),label:"Q"+q,sub:String(y),now:(cq.y===y&&cq.q===q)});q++;if(q>4){q=1;y++;}}
  }
  AXIS_START=QUARTERS[0].start;AXIS_END=QUARTERS[QUARTERS.length-1].end;AXIS_SPAN=(AXIS_END-AXIS_START)||1;
}

  const r=await fetch(`${supaBase()}/rest/v1/${TASKS}?id=eq.${encodeURIComponent(rec.id)}`,{method:"PATCH",headers:supaHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify(body)});if(!r.ok)throw new Error("task update "+r.status);}
async function remoteDeleteTask(id){const r=await fetch(`${supaBase()}/rest/v1/${TASKS}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:supaHeaders({Prefer:"return=minimal"})});if(!r.ok)throw new Error("task delete "+r.status);}
async function remoteSaveMeta(){const stamp=new Date().toISOString();const body=[{id:META_ROW,data:{meth,calls,builds,owners,standups},updated_at:stamp}];
  const r=await fetch(`${supaBase()}/rest/v1/roadmap_state?on_conflict=id`,{method:"POST",headers:supaHeaders({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});if(!r.ok)throw new Error("meta save "+r.status);}
async function remoteSeedTasks(){const now=new Date().toISOString();
  const rows=items.map(it=>({id:it.id,data:taskData(it),created_by:it._createdBy||"Seed",created_at:it._createdAt||now,updated_by:it._updatedBy||"Seed",updated_at:it._updatedAt||now}));
  const r=await fetch(`${supaBase()}/rest/v1/${TASKS}?on_conflict=id`,{method:"POST",headers:supaHeaders({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(rows)});if(!r.ok)throw new Error("seed "+r.status);await remoteSaveMeta();}
async function remoteReplaceAllTasks(){const now=new Date().toISOString();
  const rows=items.map(it=>({id:it.id,data:taskData(it),created_by:it._createdBy||currentUser||"import",created_at:it._createdAt||now,updated_by:currentUser||"import",updated_at:now}));
  await fetch(`${supaBase()}/rest/v1/${TASKS}?on_conflict=id`,{method:"POST",headers:supaHeaders({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(rows)});
  try{const keep=new Set(items.map(i=>i.id));const existing=await remoteLoadTasks();for(const ex of existing){if(!keep.has(ex.id)){try{await remoteDeleteTask(ex.id);}catch(e){}}}}catch(e){}
  await remoteSaveMeta();}
/* password gate (shared team password; hash stored in the 'config' row, never plaintext) */
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}
async function remoteLoadConfig(){try{const r=await fetch(`${supaBase()}/rest/v1/roadmap_state?id=eq.config&select=data`,{headers:supaHeaders()});if(!r.ok)return null;const rows=await r.json();return rows[0]?rows[0].data:null;}catch(e){return null;}}
async function remoteSaveConfig(data){const r=await fetch(`${supaBase()}/rest/v1/roadmap_state?on_conflict=id`,{method:"POST",headers:supaHeaders({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify([{id:"config",data,updated_at:new Date().toISOString()}])});if(!r.ok)throw new Error("config save "+r.status);}
const GATEKEY="carbonos_gate";
function ensureGate(){return new Promise(async(resolve)=>{
  if(!(window.crypto&&crypto.subtle)){resolve(true);return;} // failsafe: never lock out if crypto unavailable
  const cfg=await remoteLoadConfig();const stored=cfg&&cfg.passHash;
  let saved="";try{saved=localStorage.getItem(GATEKEY)||"";}catch(e){}
  if(stored&&saved===stored){resolve(true);return;}
  const gate=document.getElementById("gate"),msg=document.getElementById("gateMsg"),inp=document.getElementById("gateInput"),btn=document.getElementById("gateBtn"),err=document.getElementById("gateErr"),hint=document.getElementById("gateHint");
  const setup=!stored;
  msg.textContent=setup?"Set a password for this dashboard.":"Enter the team password to continue.";
  hint.textContent=setup?"First-time setup — you're choosing the password the whole team will use. Share it with them privately.":"";
  btn.textContent=setup?"Set password & enter":"Unlock";
  gate.hidden=false;setTimeout(()=>inp.focus(),100);
  async function submit(){const v=inp.value;if(!v)return;err.textContent="";
    if(setup&&v.length<4){err.textContent="Use at least 4 characters.";return;}
    const h=await sha256(v);
    if(setup){try{await remoteSaveConfig({passHash:h});}catch(e){err.textContent="Couldn't save — try again.";return;}}
    else if(h!==stored){err.textContent="Wrong password.";inp.value="";inp.focus();return;}
    try{localStorage.setItem(GATEKEY,h);}catch(e){}
    gate.hidden=true;resolve(true);
  }
  btn.onclick=submit;inp.onkeydown=e=>{if(e.key==="Enter")submit();};
});}
function sigOf(tasks,metaRow){return tasks.map(t=>t.id+"@"+(t._updatedAt||"")).sort().join(",")+"|"+(metaRow?metaRow.updated_at:"");}
function editingOpen(){return editingId!==null||editingCall!==null||editingMeth!==null||editingStandup!==null;}
async function remotePoll(){
  if(!REMOTE_ON||editingOpen())return;
  try{const [tasks,metaRow]=await Promise.all([remoteLoadTasks(),remoteLoadMeta()]);
    const sig=sigOf(tasks,metaRow);if(sig===lastSig)return;lastSig=sig;
    items=tasks;applyMeta(metaRow?metaRow.data:null);migrateItems();cacheLocal();renderAll();
  }catch(e){}
}

function applyState(d){items=d.items||[];meth=d.meth||[];calls=d.calls||[];builds=d.builds||[];owners=d.owners||[];standups=d.standups||[];if(!meth.length)meth=SEED_METH.slice();
  meth.forEach(m=>{if(m.due===undefined)m.due="";});migrateItems();if(!owners.length)seedOwnersFromItems();}
function applyMeta(d){d=d||{};meth=d.meth||[];calls=d.calls||[];builds=d.builds||[];owners=d.owners||[];standups=d.standups||[];if(!meth.length)meth=SEED_METH.slice();
  meth.forEach(m=>{if(m.due===undefined)m.due="";});if(!owners.length)seedOwnersFromItems();}
function seedState(){items=SEED_ITEMS.slice();meth=SEED_METH.slice();calls=SEED_CALLS.slice();builds=SEED_BUILD.slice();standups=[];migrateItems();seedOwnersFromItems();}
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify({items,meth,calls,builds,owners,standups}));}catch(e){}}
async function load(){
  // 1) shared team database (Supabase) — tasks are per-row, everything else is one "meta" row
  if(REMOTE_ON){
    try{const [tasks,metaRow]=await Promise.all([remoteLoadTasks(),remoteLoadMeta()]);
      if(tasks&&tasks.length){items=tasks;applyMeta(metaRow?metaRow.data:null);migrateItems();lastSig=sigOf(tasks,metaRow);cacheLocal();return;}
      // empty database — seed it once from the built-in roadmap
      seedState();try{await remoteSeedTasks();}catch(e){}cacheLocal();return;
    }catch(e){/* offline / misconfigured — fall back to a local copy below */}
  }
  // 2) Claude artifact storage, when running inside the Claude app
  try{if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value){applyState(JSON.parse(r.value));return;}}}catch(e){}
  // 3) browser localStorage — persists edits on GitHub Pages / any static host
  try{const raw=localStorage.getItem(KEY);if(raw){applyState(JSON.parse(raw));return;}}catch(e){}
  // 4) first run anywhere — seed from the built-in roadmap
  seedState();await save(true);
}
// save() persists the "meta" bundle (methodology, calls, builds, owners) + a local cache.
// Individual tasks are written per-row via persistTaskUpsert() / persistTaskDelete().
async function save(silent){
  cacheLocal();
  let ok=false;
  if(REMOTE_ON){try{await remoteSaveMeta();ok=true;}catch(e){}}
  else{try{if(window.storage){await window.storage.set(KEY,JSON.stringify({items,meth,calls,builds,owners,standups}));ok=true;}}catch(e){}}
  if(!silent)flash(REMOTE_ON?(ok?"Saved — synced":"Saved locally · sync failed"):"Saved");
}
async function persistTaskUpsert(rec,isNew){
  if(REMOTE_ON){let ok=false;try{isNew?await remoteInsertTask(rec):await remoteUpdateTask(rec);ok=true;}catch(e){}try{await remoteSaveMeta();}catch(e){}cacheLocal();flash(ok?"Saved — synced":"Saved locally · sync failed");}
  else{await save();}
}
async function persistTaskDelete(id){
  if(REMOTE_ON){let ok=false;try{await remoteDeleteTask(id);ok=true;}catch(e){}try{await remoteSaveMeta();}catch(e){}cacheLocal();flash(ok?"Deleted — synced":"Deleted locally · sync failed");}
  else{await save();}
}

const statusMeta=(k)=>STATUSES.find(s=>s.k===k)||STATUSES[0];
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function horizonOf(it){if(it.status==="Shipped")return{k:"Shipped"};if(it.status==="Parked")return{k:"Parked"};const s=pd(it.start);if(!s)return{k:"Later"};const si=qOrd(s),ci=qOrd(TODAY);if(si<=ci)return{k:"Now"};if(si===ci+1)return{k:"Next"};return{k:"Later"};}

function renderStrip(){
  const now=items.filter(i=>horizonOf(i).k==="Now").length,shipped=items.filter(i=>i.status==="Shipped").length;
  const active=items.filter(i=>!["Shipped","Parked","Not Started"].includes(i.status)).length,crit=items.filter(i=>i.impact==="Critical").length;
  const last=items.filter(i=>i._updatedAt).sort((a,b)=>new Date(b._updatedAt)-new Date(a._updatedAt))[0];
  const cells=[{n:items.length,l:"On the roadmap"},{n:now,l:"Now",accent:true},{n:active,l:"In flight",purple:true},{n:crit,l:"Critical impact"},{n:shipped,l:"Shipped"}];

function renderLegend(){document.getElementById("legend").innerHTML=`<span style="color:var(--ink-dim)">STATUS</span>`+STATUSES.map(s=>`<span class="item"><span class="sw" style="background:${s.c}"></span>${s.k}</span>`).join("")+`<span class="item" style="margin-left:8px"><span style="color:var(--ink-dim)">BAR WIDTH = EFFORT (XS→XL)</span></span>`;}
function passFilter(it){if(filters.status&&it.status!==filters.status)return false;if(filters.type&&it.type!==filters.type)return false;if(filters.impact&&it.impact!==filters.impact)return false;if(filters.archetype&&it.archetype!==filters.archetype)return false;if(filters.q){const h=(it.name+" "+(it.notes||"")+" "+(it.owner||"")+" "+(it.archetype||"")).toLowerCase();if(!h.includes(filters.q.toLowerCase()))return false;}return true;}
function sortItems(list){const imp=i=>IMPACT.indexOf(i.impact),eff=i=>EFFORT.indexOf(i.effort),arr=list.slice();
  if(sortBy==="impact")arr.sort((a,b)=>(imp(b)-imp(a))||(pd(a.start)-pd(b.start)));
  else if(sortBy==="effort")arr.sort((a,b)=>(eff(a)-eff(b))||(imp(b)-imp(a)));
  else if(sortBy==="updated")arr.sort((a,b)=>(new Date(b._updatedAt||0)-new Date(a._updatedAt||0)));
  else if(sortBy==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  else if(sortBy==="archetype")arr.sort((a,b)=>(a.archetype||"").localeCompare(b.archetype||"")||(pd(a.start)-pd(b.start)));
  else arr.sort((a,b)=>(pd(a.start)-pd(b.start))||(imp(b)-imp(a)));
  return arr;}
function archeColor(n){return ownerColor("arche:"+(n||""));}
const gridTemplate=()=>`grid-template-columns: var(--namew) repeat(${QUARTERS.length}, 1fr);`;
function renderTimeline(){

function renderRow(it){
  const sm=statusMeta(it.status);const QN=QUARTERS.length;
  const s=pd(it.start)||AXIS_START;let e=pd(it.end)||s;if(e<s)e=s;
  const eInc=new Date(e.getTime()+86400000); // end date is inclusive
  const leftPct=fracOf(s)*100;let rawW=(fracOf(eInc)-fracOf(s))*100;rawW=Math.max(rawW,1.6);
  const impactTag=(it.impact==="Critical"||it.impact==="High")?`<span class="tag impact impact-3">◆ ${it.impact}</span>`:`<span class="tag impact">${it.impact}</span>`;
  const archeTag=it.archetype?`<span class="tag arche" style="background:${archeColor(it.archetype)}">${esc(it.archetype)}</span>`:"";
  const grid=QUARTERS.map(q=>`<span class="${q.now?'now':''}"></span>`).join("");
  const ownerTags=parseOwners(it.owner).map(o=>`<span class="tag owner"><span class="avatar" style="background:${ownerColor(o)}">${esc(initials(o))}</span>${esc(o)}</span>`).join("");

  const auditHint=it._updatedBy?`<span class="audit-hint" title="Added by ${esc(it._createdBy||'—')}${it._createdAt?' · '+esc(fmtDateTime(it._createdAt)):''}\nUpdated by ${esc(it._updatedBy)}${it._updatedAt?' · '+esc(fmtDateTime(it._updatedAt)):''}">✎ ${esc(it._updatedBy)}${it._updatedAt?' · '+esc(relTime(it._updatedAt)):''}</span>`:"";
  return `<div class="row" style="${gridTemplate()}"><div class="namecell"><span class="nm" data-open="${it.id}">${esc(it.name)}</span><span class="meta"><span class="tag type">${esc(it.type)}</span>${archeTag}${impactTag}${ownerTags}${prdBadge}${auditHint}</span></div>
    <div class="lane" style="grid-column:2 / span ${QN};"><div class="grid" style="grid-template-columns:repeat(${QN},1fr)">${grid}</div>
    <div class="bar" data-open="${it.id}" style="left:${leftPct}%;width:${rawW}%;background:${sm.c}" title="${esc(it.name)} · ${it.status} · ${fmtDate(it.start)} → ${fmtDate(it.end)}"><span style="overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</span><span class="eff">${it.effort}</span></div></div></div>`;

function positionNowLine(){if(roadView!=="timeline")return;document.querySelectorAll(".nowline").forEach(n=>n.remove());const fracLeft=fracOf(TODAY)*100;document.querySelectorAll("#view-roadmap .lane").forEach((lane,idx)=>{const l=document.createElement("div");l.className="nowline"+(idx===0?" first":"");l.style.left=fracLeft+"%";lane.appendChild(l);});}

function quadClass(imp,eff){const hi=(imp==="Critical"||imp==="High"),lo=(eff==="XS"||eff==="S");return hi&&lo?"q-win":hi?"q-bet":lo?"q-fill":"q-drop";}

/* METHODOLOGY */
function methStatusClass(s){return s==="Done"?"done":s==="Verification"?"verify":"other";}
function methStatusLabel(s){const m=METH_STATUSES.find(x=>x.k===s);return m?m.label:s;}
function methDotColor(s){return s==="Done"?"var(--done)":s==="Verification"?"var(--verify)":"var(--notstart)";}
function dueSoon(due){if(!due)return false;const d=new Date(due);const now=new Date();const diff=(d-now)/(1000*60*60*24);return diff<=30;}
function fmtDue(due){if(!due)return"";const d=new Date(due+"T00:00");return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function renderMethStrip(){

function renderMethodology(){

  let html="";
  scopes.forEach(sc=>{
    let rows=meth.filter(m=>m.scope===sc.k);const done=rows.filter(m=>m.status==="Done").length;const tot=rows.length;const pct=tot?Math.round(done/tot*100):0;
    if(methFilter!=="all")rows=rows.filter(m=>m.status===methFilter);
    if(methQ)rows=rows.filter(m=>(m.id+" "+(m.note||"")).toLowerCase().includes(methQ.toLowerCase()));
    const rowsHtml=rows.length?rows.map(m=>{
      const cls=methStatusClass(m.status);
      const dueHtml=m.due?`<span class="mdue ${dueSoon(m.due)?'due-soon':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${fmtDue(m.due)}</span>`:"";
      return `<div class="mrow" data-meth="${esc(m.id)}"><span class="stat-dot" style="background:${methDotColor(m.status)}"></span>
        <div class="mid"><div class="mname">${esc(m.id)}</div>${m.note?`<div class="mnote">${esc(m.note)}</div>`:''}</div>
        ${dueHtml}<span class="cat-pill">${m.cat==='Sub-module'?'sub':'main'}</span>
        <span class="mstat ${cls}">${methStatusLabel(m.status)}</span>

function renderPullPanel(){

  const painW={High:3,Medium:2,Low:1}, sentW={Positive:1.3,Neutral:1,Negative:0.6};
  const ind={};
  const ensure=k=>ind[k]=ind[k]||{calls:0,callPull:0,High:0,Medium:0,Low:0,sent:0,gtmPull:0,gtmAcc:0,replies:0};
  calls.forEach(c=>{const o=ensure(c.industry||"Unspecified");

    o.calls++;o.callPull+=pw*sw;o.sent+=sw;
    o[["High","Medium","Low"].includes(c.pain)?c.pain:"Medium"]++;
  });

  if(hasGtm)for(const [k,v] of Object.entries(gtm.byIndustry)){const o=ensure(k);o.gtmPull=v.gtmPull||0;o.gtmAcc=v.accounts||0;o.replies=v.replies||0;}

  const maxCall=Math.max(...rows.map(r=>r.callPull),0.0001), maxGtm=Math.max(...rows.map(r=>r.gtmPull),0.0001);
  rows.forEach(r=>{r.score=hasGtm?(0.5*(r.callPull/maxCall)+0.5*(r.gtmPull/maxGtm)):(r.callPull/maxCall);});
  rows.sort((a,b)=>b.score-a.score||b.callPull-a.callPull);
  const maxScore=Math.max(...rows.map(r=>r.score),0.0001), top=rows[0];
  const barCol=r=>r.calls?(r.avg>1.12?"var(--green)":r.avg>=0.85?"var(--purple)":"var(--coral)"):"var(--purple-2)";
  const domPain=r=>(r.High>=r.Medium&&r.High>=r.Low)?"High":(r.Medium>=r.Low?"Medium":"Low");
  const sLab=a=>a>1.12?"positive":a>=0.85?"mixed":"cool";

      <div class="pull-tags">${tags.join("")}</div></div>`;
  }).join("");
  const blend=hasGtm?"call signal (frequency × pain × sentiment) blended 50/50 with live GTM pipeline (deal stage + inbound)":"call frequency × pain intensity × meeting sentiment";
  let gtmLine="";

  el.innerHTML=`<div class="sec-title"><span class="kick">Signal</span><h2>Where we have pull</h2><span class="rule"></span></div>
    <div class="pain-sub">A <b>pull score</b> per industry — ${blend}. Strongest pull: <b>${esc(top.k)}</b>${top.calls?` — ${top.calls} call${top.calls>1?'s':''}, ${sLab(top.avg)} sentiment`:``}${top.gtmAcc?`${top.calls?'; ':' — '}${top.gtmAcc} accounts in the GTM motion`:``}.</div>
    <div class="pull-bars">${bars}</div>
    <div class="pain-legend"><span class="k"><span class="sw" style="background:var(--green)"></span>Positive</span><span class="k"><span class="sw" style="background:var(--purple)"></span>Mixed</span><span class="k"><span class="sw" style="background:var(--coral)"></span>Cool</span><span class="k"><span class="sw" style="background:var(--purple-2)"></span>Pipeline only</span><span class="k" style="margin-left:auto;color:var(--ink-faint)">bar = pull score 0–100</span></div>

}

/* --- parse pasted meeting notes into a draft call (best-effort, offline) --- */
function cleanNote(s){return (s||"").replace(/\s*\d+\s*$/,"").replace(/\s+/g," ").trim();}
function guessCustomer(title){
  if(!title)return"";let parts=[title];
  [/<>/,/\sx\s/i,/:/,/\s-\s/,/–/,/—/].forEach(sep=>{parts=parts.flatMap(p=>p.split(sep));});
  parts=parts.map(p=>p.trim()).filter(Boolean).filter(p=>!/climes/i.test(p));
  let cand=parts[0]||title;
  cand=cand.replace(/\b(carbon.*|GHG.*|SBTi.*|CBAM.*|CCTS.*|meeting.*|call.*|demo.*|migration.*|exploration.*|technical.*|net[- ]?zero.*|initiative.*|platform.*|chapter.*)$/i,"").trim();
  return cand||title;
}
function inferIndustry(name,low){
  name=(name||"").toLowerCase();
  const map=[["Banking & Finance",/bank|\bsbi\b|financ|pcaf|nbfc/],["IT Services",/infosys|tech mahindra|\btcs\b|wipro|it services/],["Automotive",/hyundai|automotive|\bmotor\b|vehicle|\boem\b/],["Metals",/metal|steel|alumin|extrusion|forging/],["Chemicals",/chemical|rasayan/],["Logistics",/logistic|freight|jeena|varuna|warehouse|shipping/],["Paper & Packaging",/paper|packaging|satia|pulp/],["Consulting",/consult|ecociate|advisory|\bgiz\b/],["Membership & Events",/\bypo\b|chapter|event|member/],["FMCG",/fmcg|consumer goods|unilever|cola/],["Manufacturing",/manufactur|factory|\bplant\b|industrial/]];
  for(const [ind,re] of map){if((name&&re.test(name))||re.test(low))return ind;}
  return "";
}
function parseNotes(raw){
  raw=(raw||"").replace(/\r/g,"");const out={},low=raw.toLowerCase();
  (raw.match(/https?:\/\/[^\s"')]+/g)||[]).forEach(u=>{if(/pressplay\.vastoo/i.test(u))out.sourceUrl=u;else if(/climes\.io/i.test(u))out.demoUrl=u;else if(!out.sourceUrl)out.sourceUrl=u;});
  let lines=raw.split("\n").map(s=>s.trim()).filter(Boolean)
    .filter(l=>!/^(URL:|Source element:|---|Made with PressPlay|Because|Get PressPlay|Share notes)/i.test(l)&&!/^https?:/i.test(l));
  let title=(lines[0]||"").replace(/^Title:\s*/i,"").replace(/^PressPlay:\s*/i,"").trim();
  out.customer=guessCustomer(title);
  const dm=raw.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s*(\d{4})\b/);
  if(dm){const mo=["january","february","march","april","may","june","july","august","september","october","november","december"].indexOf(dm[1].toLowerCase())+1;out.date=`${dm[3]}-${String(mo).padStart(2,"0")}-${String(+dm[2]).padStart(2,"0")}`;}
  else if(/\byesterday\b/i.test(raw)){const d=new Date();d.setDate(d.getDate()-1);out.date=d.toISOString().slice(0,10);}
  else if(/\btoday\b/i.test(raw)){out.date=new Date().toISOString().slice(0,10);}
  const tl=raw.match(/TL;?DR[:\s]*([\s\S]*?)(?:\n\s*\n|\n[A-Z][^\n]{2,60}\n)/i);
  if(tl)out.insight=cleanNote(tl[1]);else{const i=lines.findIndex(l=>/^TL;?DR/i.test(l));if(i>=0&&lines[i+1])out.insight=cleanNote(lines[i+1]);}
  const qm=raw.match(/["“”]([^"“”]{12,220})["“”]/);if(qm)out.quote=cleanNote(qm[1]);
  out.type=/\bdemo\b|demonstrat/.test(low)?"Demo":/migrat|onboard/.test(low)?"Onboarding":/renewal/.test(low)?"Renewal":/\bfeedback\b/.test(low)?"Feedback":/proposal|pricing|\bmou\b|sales/.test(low)?"Sales":"Discovery";
  const themeRules=[["CBAM",/cbam/],["CCTS",/ccts/],["PCAF",/pcaf|financed emission/],["SBTi",/sbti|science[- ]based/],["Product LCA",/\blca\b|product carbon|\bpcf\b|life ?cycle/],["EPD",/\bepd\b/],["Offsetting",/offset|carbon credit|retire|verra|gold standard|net[- ]?zero/],["BRSR",/brsr/],["Data automation",/excel|upload|automat|activity data|data collection|migrat/],["Benchmarking",/benchmark/],["Dashboards",/dashboard|analytics|exec[- ]ready/],["Customer engagement",/customer engagement|email report/],["Methodology",/methodolog|scope 3 (confus|classif)|not applicable/]];
  out.themes=themeRules.filter(([t,re])=>re.test(low)).map(([t])=>t);if(!out.themes.length)out.themes=["Other"];
  out.pain=/(on hold|urgent|obstacle|time consuming|big problem|calamity|blocker)/.test(low)?"High":/(no pressure|not that complex|already ahead|no urgency|no immediate|good to have)/.test(low)?"Low":"Medium";
  out.sentiment=/(amazing|excited|enthusi|leaned in|very positive|impressed|keen|exactly what|committed|got my attention)/.test(low)?"Positive":/(declined|no urgency|already ahead|hesitat|not ready|skeptic|rolled back|not that complex|no immediate pressure)/.test(low)?"Negative":"Neutral";
  out.industry=inferIndustry(out.customer,low);
  out.prio="P1";
  return out;
}

}
